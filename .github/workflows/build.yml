name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: free60/libxenon:latest
    env:
      DEVKITXENON: /usr/local/xenon
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          XGCC=$(find / \( -type f -o -type l \) -name xenon-gcc 2>/dev/null | head -n1)
          echo "xenon-gcc encontrado em: $XGCC"
          export PATH="$PATH:$(dirname "$XGCC"):/usr/local/xenon/bin"
          which xenon-gcc
          make
      - name: Preparar xenon.elf
        run: |
          mkdir -p dist
          cp fazenda360.elf32 dist/xenon.elf
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: fazenda360-xenon-elf
          path: dist/xenon.elf
